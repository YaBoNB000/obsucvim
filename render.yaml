services:
  - type: web
    name: obsucvim-discord
    runtime: docker
    plan: free
    dockerfilePath: ./services/discord_obf/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
