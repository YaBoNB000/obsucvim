# Copy this file to .github/workflows/build-engine.yml in the repository.
#
# The Arena agent cannot push files under .github/ (its GitHub App lacks the
# `workflows` permission), so this is provided here instead. Once it is in place,
# every push that touches obsucvim/** builds the engine on GitHub's runner
# (Rust is preinstalled there) and uploads obsucvim.wasm as a run artifact.
#
# The verify step compares the build against the R067 anchor:
#   print("suda") --env-check --bind-executor --bind-env roblox --seed 67067
#   229,422 B   sha256 3775f3b557ca4c95ee16d9d013f290d735b6c022af23ac17f1d0b2339fc689f6
name: build-engine-wasm

on:
  push:
    paths:
      - "obsucvim/**"
      - ".github/workflows/build-engine.yml"
      - "web/tools/wasi-runner.mjs"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust + wasm32-wasip1
        run: |
          rustup target add wasm32-wasip1
          rustc --version

      - name: Build engine
        working-directory: obsucvim
        run: cargo build --release --target wasm32-wasip1

      - name: Verify the R067 anchor
        run: node web/tools/verify-engine-version.mjs obsucvim/target/wasm32-wasip1/release/obsucvim.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: obsucvim-wasm
          path: obsucvim/target/wasm32-wasip1/release/obsucvim.wasm
